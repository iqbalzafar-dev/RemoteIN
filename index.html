<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RemoteIN — Verified Remote Jobs for India & APAC</title>
  
  <!-- SEO & Social Open Graph Tags -->
  <meta name="description" content="Discover verified remote tech and non-tech opportunities open to talent in India and APAC. Updated hourly via automated pipelines." />
  <meta name="keywords" content="Remote Jobs India, APAC Remote Careers, Tech Jobs, Non-Tech Remote Work, Work From Home" />
  <meta property="og:title" content="RemoteIN — Verified Remote Jobs for India & APAC" />
  <meta property="og:description" content="Curated remote openings across Tech, Operations, HR, Finance, and Customer Experience." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://iqbalzafar-dev.github.io/RemoteIN/" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --tag-tech: #0ea5e9;
      --tag-nontech: #10b981;
      --badge-new: #ef4444;
      --badge-bg: #1e1b4b;
      --badge-border: #4338ca;
      --card-bg: #1e293b;
      --input-bg: #0f172a;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --tag-tech: #0284c7;
      --tag-nontech: #059669;
      --badge-new: #dc2626;
      --badge-bg: #e0e7ff;
      --badge-border: #c7d2fe;
      --card-bg: #ffffff;
      --input-bg: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.4;
      transition: background-color 0.2s ease, color 0.2s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
    }

    .nav-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .count-indicator {
      font-size: 0.72rem;
      background: var(--surface-border);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 12px 16px;
      flex: 1;
      width: 100%;
    }

    /* Controls Panel */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-box-wrapper {
      position: relative;
      flex: 1;
    }

    .search-input {
      width: 100%;
      padding: 8px 30px 8px 12px;
      background: var(--input-bg);
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .clear-search {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      line-height: 1;
    }

    .sort-select {
      background: var(--input-bg);
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.82rem;
      outline: none;
    }

    .filter-chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
    }

    .chips-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #0f172a;
    }

    /* Jobs List & Compact Cards */
    #jobs-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .job-card {
      background: var(--card-bg);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.1s ease, border-color 0.15s ease;
    }

    .job-card:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .card-main {
      flex: 1;
      min-width: 0;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .job-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .company-name {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.7rem;
    }

    .badge {
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
    }

    .badge-tech {
      background: rgba(14, 165, 233, 0.15);
      color: var(--tag-tech);
    }

    .badge-nontech {
      background: rgba(16, 185, 129, 0.15);
      color: var(--tag-nontech);
    }

    .badge-new {
      background: var(--badge-new);
      color: #ffffff;
      font-size: 0.62rem;
      padding: 0 4px;
      border-radius: 3px;
      font-weight: 700;
      animation: pulse 2s infinite;
    }

    .badge-location {
      background: var(--surface-border);
      color: var(--text-muted);
    }

    .badge-location.india {
      border: 1px solid #f59e0b;
      color: #f59e0b;
    }

    .badge-location.apac {
      border: 1px solid #8b5cf6;
      color: #8b5cf6;
    }

    .date-text {
      color: var(--text-muted);
      font-size: 0.7rem;
      margin-left: auto;
    }

    .card-action {
      display: flex;
      align-items: center;
    }

    .apply-btn {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .job-card:hover .apply-btn {
      background: var(--primary);
      color: #0f172a;
    }

    /* Fallbacks & Alerts */
    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    @media (max-width: 600px) {
      .nav-container { padding: 8px 12px; }
      main { padding: 8px 12px; }
      .job-card { padding: 8px 10px; }
      .job-title { font-size: 0.86rem; }
      .company-name { font-size: 0.72rem; }
      .apply-btn { display: none; } /* Saves screen space on small viewports */
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="brand">
        <h1>RemoteIN</h1>
        <span class="count-indicator" id="jobs-count">Loading...</span>
      </div>
      <button class="theme-toggle" id="theme-btn" aria-label="Toggle Theme">☀️ Light</button>
    </div>
  </header>

  <main>
    <div class="controls">
      <!-- Search & Sort Row -->
      <div class="search-row">
        <div class="search-box-wrapper">
          <input type="text" id="search-input" class="search-input" placeholder="Search by title, skill, or company..." autocomplete="off" />
          <button id="clear-search" class="clear-search" aria-label="Clear search">&times;</button>
        </div>
        <select id="sort-select" class="sort-select" aria-label="Sort listings">
          <option value="latest">Latest</option>
          <option value="oldest">Oldest</option>
        </select>
      </div>

      <!-- Compact Filter Chips -->
      <div class="filter-chips-container">
        <!-- Category Filter -->
        <div class="chips-group" id="category-chips">
          <button class="chip active" data-filter="all">All Roles</button>
          <button class="chip" data-filter="tech">Tech</button>
          <button class="chip" data-filter="non-tech">Non-Tech</button>
        </div>

        <!-- Location Filter -->
        <div class="chips-group" id="location-chips">
          <button class="chip active" data-loc="all">All Locations</button>
          <button class="chip" data-loc="india">India</button>
          <button class="chip" data-loc="apac">APAC</button>
          <button class="chip" data-loc="global">Global (Eligible)</button>
        </div>
      </div>
    </div>

    <!-- Listings Container -->
    <div id="jobs-list" role="feed"></div>

    <noscript>
      <div class="empty-state">
        <h2>JavaScript Required</h2>
        <p>RemoteIN indexes live opportunities via dynamic feeds. Please enable JavaScript to access real-time job listings.</p>
      </div>
    </noscript>
  </main>

  <script>
    /* ==========================================================================
       1. CENTRALIZED KEYWORDS & CONFIGURATION (Easily Editable)
       ========================================================================== */
    const CLASSIFICATION_CONFIG = {
      // Direct substring or whole-word match for Tech roles
      techKeywords: [
        "engineer", "developer", "architect", "solutions", "data", "devops", 
        "qa", "sre", "ml", "ai", "machine learning", "backend", "frontend", 
        "fullstack", "full stack", "cloud", "infra", "security", "sysadmin", 
        "platform", "embedded", "firmware", "mobile", "ios", "android", "scrum master"
      ],
      // Non-tech override keywords (if title is ambiguous or contains overlap)
      nonTechOverrides: [
        "recruiter", "talent acquisition", "hr", "payroll", "sales", 
        "account executive", "marketing", "content", "finance", "accountant", 
        "customer support", "customer success", "operations associate", "legal"
      ],
      // APAC countries/regions keywords
      apacKeywords: [
        "india", "apac", "asia", "singapore", "australia", "japan", "philippines", 
        "vietnam", "indonesia", "malaysia", "thailand", "new zealand", "korea", "taiwan"
      ]
    };

    let jobsData = [];
    let activeCategory = "all";
    let activeLocation = "all";
    let searchQuery = "";
    let sortOrder = "latest";

    /* ==========================================================================
       2. REFINED NORMALIZATION LOGIC
       ========================================================================== */
    function classifyCategory(title = "") {
      const lower = title.toLowerCase();

      // Check non-tech explicitly first in case of hybrid phrases
      for (const kw of CLASSIFICATION_CONFIG.nonTechOverrides) {
        if (new RegExp(`\\b${kw}\\b`, 'i').test(lower)) {
          return "Non-Tech";
        }
      }

      // Check tech keywords (supports phrases like "solutions architect")
      for (const kw of CLASSIFICATION_CONFIG.techKeywords) {
        if (lower.includes(kw)) {
          return "Tech";
        }
      }

      return "Non-Tech";
    }

    function classifyLocation(loc = "") {
      const lower = loc.toLowerCase();

      if (lower.includes("india")) return "India";
      for (const kw of CLASSIFICATION_CONFIG.apacKeywords) {
        if (lower.includes(kw)) return "APAC";
      }
      if (lower.includes("anywhere") || lower.includes("worldwide") || lower.includes("remote")) {
        return "Global";
      }
      return "Global";
    }

    function isUnder24Hours(dateStr) {
      if (!dateStr) return false;
      const jobDate = new Date(dateStr);
      if (isNaN(jobDate.getTime())) return false;
      const hoursAgo = (Date.now() - jobDate.getTime()) / (1000 * 60 * 60);
      return hoursAgo >= 0 && hoursAgo <= 24;
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return "";
      const date = new Date(dateStr);
      if (isNaN(date.getTime())) return dateStr;
      return date.toLocaleDateString("en-IN", { month: "short", day: "numeric" });
    }

    /* ==========================================================================
       3. RENDER JOBS
       ========================================================================== */
    const jobsContainer = document.getElementById("jobs-list");
    const countBadge = document.getElementById("jobs-count");

    function renderJobs() {
      const filtered = jobsData.filter(job => {
        // Category check
        const categoryMatch = (activeCategory === "all") || (job._category.toLowerCase() === activeCategory);

        // Location check
        const locationMatch = (activeLocation === "all") || (job._locCategory.toLowerCase() === activeLocation);

        // Search check
        const q = searchQuery.toLowerCase().trim();
        const searchMatch = !q || 
          job.title.toLowerCase().includes(q) || 
          (job.company && job.company.toLowerCase().includes(q)) ||
          (job.tags && job.tags.some(t => t.toLowerCase().includes(q)));

        return categoryMatch && locationMatch && searchMatch;
      });

      // Sorting
      filtered.sort((a, b) => {
        const timeA = new Date(a.date || 0).getTime();
        const timeB = new Date(b.date || 0).getTime();
        return sortOrder === "latest" ? timeB - timeA : timeA - timeB;
      });

      // Update counters
      countBadge.textContent = `${filtered.length} Jobs`;

      if (filtered.length === 0) {
        jobsContainer.innerHTML = `
          <div class="empty-state">
            <p>No matching positions found. Adjust your keywords or filter parameters.</p>
          </div>
        `;
        return;
      }

      jobsContainer.innerHTML = filtered.map(job => {
        const isTech = job._category === "Tech";
        const isNew = isUnder24Hours(job.date);
        const locClass = job._locCategory.toLowerCase();

        return `
          <a class="job-card" href="${job.url || '#'}" target="_blank" rel="noopener noreferrer">
            <div class="card-main">
              <div class="card-top">
                <span class="job-title" title="${escapeHtml(job.title)}">${escapeHtml(job.title)}</span>
                ${isNew ? '<span class="badge badge-new">NEW</span>' : ''}
              </div>
              <div class="company-name">${escapeHtml(job.company || 'Direct Employer')}</div>
              <div class="meta-row">
                <span class="badge ${isTech ? 'badge-tech' : 'badge-nontech'}">${job._category}</span>
                <span class="badge badge-location ${locClass}">${escapeHtml(job._locCategory)}</span>
                <span class="date-text">${formatDisplayDate(job.date)}</span>
              </div>
            </div>
            <div class="card-action">
              <span class="apply-btn">Apply &rarr;</span>
            </div>
          </a>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    /* ==========================================================================
       4. DATA INGESTION & PIPELINE FETCH
       ========================================================================== */
    async function loadJobs() {
      try {
        const res = await fetch(`jobs.json?v=${Date.now()}`);
        if (!res.ok) throw new Error("Could not load jobs.json");
        const raw = await res.json();

        // Standardize schema
        jobsData = raw.map(item => {
          const category = classifyCategory(item.title);
          const locCategory = classifyLocation(item.location || item.candidate_required_location || "");

          return {
            ...item,
            _category: category,
            _locCategory: locCategory,
            date: item.date || item.publication_date || item.created_at || ""
          };
        });

        renderJobs();
      } catch (err) {
        console.error(err);
        countBadge.textContent = "Offline";
        jobsContainer.innerHTML = `
          <div class="empty-state">
            <p>Failed to load current postings. Pull down or reload to retry.</p>
          </div>
        `;
      }
    }

    /* ==========================================================================
       5. EVENT LISTENERS & FILTER CONTROLS
       ========================================================================== */
    // Search box and clear button
    const searchInput = document.getElementById("search-input");
    const clearBtn = document.getElementById("clear-search");

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      clearBtn.style.display = searchQuery ? "block" : "none";
      renderJobs();
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      clearBtn.style.display = "none";
      searchInput.focus();
      renderJobs();
    });

    // Sorting select
    document.getElementById("sort-select").addEventListener("change", (e) => {
      sortOrder = e.target.value;
      renderJobs();
    });

    // Category chips
    document.getElementById("category-chips").addEventListener("click", (e) => {
      if (!e.target.classList.contains("chip")) return;
      document.querySelectorAll("#category-chips .chip").forEach(c => c.classList.remove("active"));
      e.target.classList.add("active");
      activeCategory = e.target.dataset.filter;
      renderJobs();
    });

    // Location chips
    document.getElementById("location-chips").addEventListener("click", (e) => {
      if (!e.target.classList.contains("chip")) return;
      document.querySelectorAll("#location-chips .chip").forEach(c => c.classList.remove("active"));
      e.target.classList.add("active");
      activeLocation = e.target.dataset.loc;
      renderJobs();
    });

    /* ==========================================================================
       6. THEME TOGGLE (Persistent)
       ========================================================================== */
    const themeBtn = document.getElementById("theme-btn");
    const currentTheme = localStorage.getItem("remotein_theme") || "dark";

    function applyTheme(theme) {
