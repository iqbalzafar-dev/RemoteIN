<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RemoteIN — Verified Remote Jobs for India & APAC</title>
  
  <meta name="description" content="Discover verified remote opportunities for India and APAC." />
  <meta property="og:title" content="RemoteIN — Remote Jobs for India & APAC" />
  <meta property="og:description" content="Curated remote openings across Tech, Operations, HR, and Finance." />
  <meta property="og:type" content="website" />

  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --tag-tech: #0ea5e9;
      --tag-nontech: #10b981;
      --badge-new: #ef4444;
      --card-bg: #1e293b;
      --input-bg: #0f172a;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --tag-tech: #0284c7;
      --tag-nontech: #059669;
      --badge-new: #dc2626;
      --card-bg: #ffffff;
      --input-bg: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .count-indicator {
      font-size: 0.72rem;
      background: var(--surface-border);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 12px 16px;
      flex: 1;
      width: 100%;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-box-wrapper {
      position: relative;
      flex: 1;
    }

    .search-input {
      width: 100%;
      padding: 8px 30px 8px 12px;
      background: var(--input-bg);
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
    }

    .clear-search {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
    }

    .sort-select {
      background: var(--input-bg);
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.82rem;
      outline: none;
    }

    .filter-chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .chips-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #0f172a;
    }

    #jobs-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .job-card {
      background: var(--card-bg);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.1s ease, border-color 0.15s ease;
    }

    .job-card:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .card-main {
      flex: 1;
      min-width: 0;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .job-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .company-name {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.7rem;
      align-items: center;
    }

    .badge {
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .badge-tech {
      background: rgba(14, 165, 233, 0.15);
      color: var(--tag-tech);
    }

    .badge-nontech {
      background: rgba(16, 185, 129, 0.15);
      color: var(--tag-nontech);
    }

    .badge-new {
      background: var(--badge-new);
      color: #ffffff;
      font-size: 0.62rem;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: bold;
    }

    .badge-location {
      background: var(--surface-border);
      color: var(--text-muted);
    }

    .badge-location.india {
      border: 1px solid #f59e0b;
      color: #f59e0b;
    }

    .badge-location.apac {
      border: 1px solid #8b5cf6;
      color: #8b5cf6;
    }

    .date-text {
      color: var(--text-muted);
      font-size: 0.7rem;
      margin-left: auto;
    }

    .date-text.recent {
      color: var(--primary);
      font-weight: 600;
    }

    .apply-btn {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    @media (max-width: 600px) {
      .apply-btn { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="brand">
        <h1>RemoteIN</h1>
        <span class="count-indicator" id="jobs-count">Loading...</span>
      </div>
      <button class="theme-toggle" id="theme-btn">☀️ Light</button>
    </div>
  </header>

  <main>
    <div class="controls">
      <div class="search-row">
        <div class="search-box-wrapper">
          <input type="text" id="search-input" class="search-input" placeholder="Search by title or company..." />
          <button id="clear-search" class="clear-search">&times;</button>
        </div>
        <select id="sort-select" class="sort-select">
          <option value="latest">Latest</option>
          <option value="oldest">Oldest</option>
        </select>
      </div>

      <div class="filter-chips-container">
        <div class="chips-group" id="category-chips">
          <button class="chip active" data-filter="all">All Roles</button>
          <button class="chip" data-filter="tech">Tech</button>
          <button class="chip" data-filter="non-tech">Non-Tech</button>
        </div>

        <div class="chips-group" id="location-chips">
          <button class="chip active" data-loc="all">All Locations</button>
          <button class="chip" data-loc="india">India</button>
          <button class="chip" data-loc="apac">APAC</button>
          <button class="chip" data-loc="global">Global</button>
        </div>
      </div>
    </div>

    <div id="jobs-list"></div>
  </main>

  <script>
    let jobsData = [];
    let activeCategory = "all";
    let activeLocation = "all";
    let searchQuery = "";
    let sortOrder = "latest";

    const TECH_KEYWORDS = [
      "engineer", "developer", "architect", "solutions", "data", "devops", 
      "qa", "sre", "ml", "ai", "machine learning", "backend", "frontend", 
      "fullstack", "cloud", "security", "sysadmin", "mobile", "ios", "android"
    ];

    const NON_TECH_KEYWORDS = [
      "recruiter", "talent acquisition", "hr", "payroll", "sales", 
      "marketing", "content", "finance", "accountant", "support", "operations"
    ];

    const APAC_KEYWORDS = ["india", "apac", "asia", "singapore", "australia", "japan", "philippines", "malaysia", "indonesia"];

    function classifyCategory(title) {
      if (!title) return "Non-Tech";
      const t = String(title).toLowerCase();
      for (let k of NON_TECH_KEYWORDS) {
        if (t.includes(k)) return "Non-Tech";
      }
      for (let k of TECH_KEYWORDS) {
        if (t.includes(k)) return "Tech";
      }
      return "Non-Tech";
    }

    function classifyLocation(loc) {
      if (!loc) return "Global";
      const l = String(loc).toLowerCase();
      if (l.includes("india")) return "India";
      for (let k of APAC_KEYWORDS) {
        if (l.includes(k)) return "APAC";
      }
      return "Global";
    }

    // 24-hour check & dynamic time display
    function getDisplayDate(dateStr) {
      if (!dateStr) return { text: "", isRecent: false };
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return { text: String(dateStr).slice(0, 10), isRecent: false };

      const diffMs = Date.now() - d.getTime();
      const diffHours = Math.floor(diffMs / (1000 * 60 * 60));

      if (diffHours >= 0 && diffHours < 24) {
        if (diffHours <= 0) {
          const diffMins = Math.max(1, Math.floor(diffMs / (1000 * 60)));
          return { text: `${diffMins}m ago`, isRecent: true };
        }
        return { text: `${diffHours}h ago`, isRecent: true };
      }

      // 24 hours se purana hone par: "3 Oct"
      return { 
        text: d.toLocaleDateString("en-IN", { day: "numeric", month: "short" }), 
        isRecent: false 
      };
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }

    function renderJobs() {
      const container = document.getElementById("jobs-list");
      const countEl = document.getElementById("jobs-count");

      const filtered = jobsData.filter(job => {
        const catOk = (activeCategory === "all") || (job._category.toLowerCase() === activeCategory);
        const locOk = (activeLocation === "all") || (job._locCategory.toLowerCase() === activeLocation);
        const q = searchQuery.toLowerCase().trim();
        const searchOk = !q || 
          job.title.toLowerCase().includes(q) || 
          job.company.toLowerCase().includes(q);

        return catOk && locOk && searchOk;
      });

      filtered.sort((a, b) => {
        const tA = new Date(a.date || 0).getTime() || 0;
        const tB = new Date(b.date || 0).getTime() || 0;
        return sortOrder === "latest" ? tB - tA : tA - tB;
      });

      countEl.textContent = `${filtered.length} Jobs`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>No jobs found matching your criteria.</p></div>`;
        return;
      }

      container.innerHTML = filtered.map(job => {
        const isTech = job._category === "Tech";
        const dateInfo = getDisplayDate(job.date);
        const locClass = job._locCategory.toLowerCase();

        return `
          <a class="job-card" href="${job.url}" target="_blank" rel="noopener noreferrer">
            <div class="card-main">
              <div class="card-top">
                <span class="job-title">${escapeHtml(job.title)}</span>
                ${dateInfo.isRecent ? '<span class="badge badge-new">NEW</span>' : ''}
              </div>
              <div class="company-name">${escapeHtml(job.company)}</div>
              <div class="meta-row">
                <span class="badge ${isTech ? 'badge-tech' : 'badge-nontech'}">${job._category}</span>
                <span class="badge badge-location ${locClass}">${escapeHtml(job._locCategory)}</span>
                <span class="date-text ${dateInfo.isRecent ? 'recent' : ''}">${escapeHtml(dateInfo.text)}</span>
              </div>
            </div>
            <div>
              <span class="apply-btn">Apply &rarr;</span>
            </div>
          </a>
        `;
      }).join('');
    }

    async function loadData() {
      const countEl = document.getElementById("jobs-count");
      const container = document.getElementById("jobs-list");
      
      try {
        const response = await fetch('jobs.json?v=' + Date.now());
        if (!response.ok) throw new Error("HTTP " + response.status);
        
        let raw = await response.json();
        let items = Array.isArray(raw) ? raw : (raw.jobs || raw.data || []);

        jobsData = items.map(item => ({
          title: item.title || item.role || item.position || "Opening",
          company: item.company || item.company_name || "Direct Employer",
          url: item.url || item.apply_url || item.link || "#",
          date: item.date || item.created_at || item.publication_date || "",
          _category: classifyCategory(item.title || item.role),
          _locCategory: classifyLocation(item.location || item.candidate_required_location)
        }));

        renderJobs();
      } catch (err) {
        console.error("Fetch failed:", err);
        countEl.textContent = "0 Jobs";
        container.innerHTML = `<div class="empty-state"><p>Could not load jobs list.</p></div>`;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const themeBtn = document.getElementById("theme-btn");
      themeBtn.addEventListener("click", () => {
        const isLight = document.documentElement.getAttribute("data-theme") === "light";
        if (isLight) {
          document.documentElement.removeAttribute("data-theme");
          themeBtn.textContent = "☀️ Light";
        } else {
          document.documentElement.setAttribute("data-theme", "light");
          themeBtn.textContent = "🌙 Dark";
        }
      });

      const catChips = document.querySelectorAll("#category-chips .chip");
      catChips.forEach(chip => {
        chip.addEventListener("click", function() {
          catChips.forEach(c => c.classList.remove("active"));
          this.classList.add("active");
          activeCategory = this.getAttribute("data-filter");
          renderJobs();
        });
      });

      const locChips = document.querySelectorAll("#location-chips .chip");
      locChips.forEach(chip => {
        chip.addEventListener("click", function() {
          locChips.forEach(c => c.classList.remove("active"));
          this.classList.add("active");
          activeLocation = this.getAttribute("data-loc");
          renderJobs();
        });
      });

      const searchBox = document.getElementById("search-input");
      const clearBtn = document.getElementById("clear-search");
      searchBox.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        clearBtn.style.display = searchQuery ? "block" : "none";
        renderJobs();
      });

      clearBtn.addEventListener("click", () => {
        searchBox.value = "";
        searchQuery = "";
        clearBtn.style.display = "none";
        renderJobs();
      });

      document.getElementById("sort-select").addEventListener("change", (e) => {
        sortOrder = e.target.value;
        renderJobs();
      });

      loadData();
    });
  </script>
</body>
</html>
